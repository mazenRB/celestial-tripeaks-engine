name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  DART_SDK_VERSION: 3.11.4

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK_VERSION }}

      - name: Resolve dependencies
        run: dart pub get

      - name: Validate release tag and changelog
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"

          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $tag"
            exit 1
          fi

          pubspec_version="$(awk '/^version: / {print $2; exit}' pubspec.yaml)"
          if [[ "$pubspec_version" != "$version" ]]; then
            echo "pubspec.yaml version ($pubspec_version) does not match tag ($version)."
            exit 1
          fi

          if ! grep -q "^## \[$version\]" CHANGELOG.md; then
            echo "CHANGELOG.md is missing an entry for version $version."
            exit 1
          fi

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis
        run: dart analyze

      - name: Run tests
        run: dart test

      - name: Prepare publish validation tree
        run: |
          set -euo pipefail

          release_dir="${RUNNER_TEMP}/release_package"
          rm -rf "$release_dir"
          mkdir -p "$release_dir"
          cp -R \
            CHANGELOG.md \
            CONTRIBUTING.md \
            LICENSE \
            README.md \
            RELEASE_READINESS.md \
            analysis_options.yaml \
            bin \
            docs \
            example \
            lib \
            pubspec.yaml \
            test \
            "$release_dir/"
          mv "$release_dir/docs" "$release_dir/doc"
          echo "RELEASE_PACKAGE_DIR=$release_dir" >> "$GITHUB_ENV"

      - name: Publish dry-run
        working-directory: ${{ env.RELEASE_PACKAGE_DIR }}
        run: dart pub publish --dry-run

      - name: Extract release notes
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          awk "
            BEGIN {in_section=0}
            \$0 ~ \"^## \\\[$version\\\]\" {in_section=1; next}
            in_section && \$0 ~ /^## \\\[/ {exit}
            in_section {print}
          " CHANGELOG.md > "${RUNNER_TEMP}/release_notes.md"

          if [[ ! -s "${RUNNER_TEMP}/release_notes.md" ]]; then
            echo "Failed to extract release notes for $version."
            exit 1
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          prerelease_flag=""

          if [[ "$version" == *-* ]]; then
            prerelease_flag="--prerelease"
          fi

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" \
              --title "$tag" \
              $prerelease_flag \
              --notes-file "${RUNNER_TEMP}/release_notes.md"
          else
            gh release create "$tag" \
              --title "$tag" \
              $prerelease_flag \
              --notes-file "${RUNNER_TEMP}/release_notes.md"
          fi
